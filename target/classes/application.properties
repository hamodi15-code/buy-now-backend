spring.application.name=buynowdotcom

server.port=9090

spring.datasource.url=jdbc:h2:file:./data/buynowdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,ORDER
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=create

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.prefix=/api/v1
app.useSecureCookie=false

## 2 minutes
auth.token.accessExpirationInMils=120000
## 5 minutes
auth.token.refreshExpirationInMils=300000

## 5 minutes
##auth.token.accessExpirationInMils=300000
## 30 days
##auth.token.refreshExpirationInMils=2592000000

auth.token.jwtSecret=36763979244226452948404D635166546A576D5A7134743777217A25432A462D

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:5174

stripe.secret.key=${STRIPE_SECRET_KEY}
spring.profiles.active=local